name: skinbehold-footage
on:
  push:
    branches: [skinbehold-footage]
    paths: ['.github/workflows/skinbehold-footage.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download stock footage (Pexels) and audio
        run: |
          mkdir -p footage
          while read name url; do
            [ -z "$name" ] && continue
            curl -sSL --fail --retry 3 -A "Mozilla/5.0" -o "footage/$name" "$url" && echo "OK $name" || echo "FAILED $name"
          done <<'EOF'
          gift_roses.mp4 https://videos.pexels.com/video-files/6763539/6763539-hd_1080_1920_25fps.mp4
          unbox_gift.mp4 https://videos.pexels.com/video-files/6099390/6099390-hd_720_1280_50fps.mp4
          massage.mp4 https://videos.pexels.com/video-files/6813009/6813009-hd_1080_1872_30fps.mp4
          serum_drop.mp4 https://videos.pexels.com/video-files/6801666/6801666-hd_720_1280_30fps.mp4
          honey_drop.mp4 https://videos.pexels.com/video-files/7615789/7615789-hd_720_1280_24fps.mp4
          dropper_rl.mp4 https://videos.pexels.com/video-files/8131886/8131886-hd_720_1366_25fps.mp4
